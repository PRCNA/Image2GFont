<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image2GFont</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/style.css"></head><body>
<div id="splash">Image2GFont</div>
<aside id="nav"><div class="brand"><img src="/logo.svg" alt=""><strong>Image2GFont</strong></div><div class="section" data-t="workspace"></div><button id="import" data-t="import"></button><button id="open" data-t="open"></button><button id="save" data-t="save"></button><button id="restore" data-t="restore"></button><div class="section" data-t="output"></div><button id="export" data-t="export"></button><button id="generate" data-t="generate"></button><div class="spacer"></div><button id="settings" data-t="settings"></button><small data-t="local"></small></aside>
<main><header><div><span class="eyebrow" data-t="workspace"></span><h1 data-t="review"></h1></div><select id="pages" aria-label="Page"></select><span id="count" class="pill"></span></header>
<div id="workspace"><section id="imagePanel" class="panel"><div class="panelhead" id="imageDrag"><span data-t="image"></span><div><button id="deleteCandidate" data-t="deleteCandidate"></button><button id="undoDelete" data-t="undoDelete"></button><button id="edit" data-t="edit"></button><button id="detachImage" title="Detach">↗</button></div></div><div id="imageStage"><div class="dropPrompt" data-t="dropImages"></div><div id="empty"><img src="/logo.svg" alt=""><h2 data-t="welcome"></h2><p data-t="intro"></p><button class="primary" id="start" data-t="import"></button></div><canvas id="imageCanvas"></canvas></div><div class="panelFoot" data-t="imageHint"></div></section>
<div id="splitter" role="separator" tabindex="0" aria-label="Resize" aria-orientation="vertical"></div>
<section id="textPanel" class="panel"><div class="panelhead" id="textDrag"><span data-t="characters"></span><button id="detachText" title="Detach">↗</button></div><div class="reviewTools"><label><input id="pendingOnly" type="checkbox"><span data-t="pendingOnly"></span></label><button id="nextPending" data-t="nextPending"></button><span id="pendingCount"></span></div><input id="search" data-placeholder="search"><div id="glyphs"></div><div id="inspector"><strong id="reviewState"></strong><div class="comparison"><div><small data-t="original"></small><b id="originalText"></b></div><div><small data-t="suggest"></small><b id="modelText"></b></div></div><div id="suggestion"></div><div class="row"><button id="recognize" data-t="recognize"></button><button id="useSuggestion" data-t="useSuggestion"></button></div><label for="character" data-t="manualCharacter"></label><input id="character" maxlength="2"><label for="note" data-t="note"></label><textarea id="note" rows="2" data-placeholder="noteHint"></textarea><div class="row"><button id="flagReview" data-t="flagReview"></button><button id="saveNote" data-t="saveNote"></button></div><div class="row"><button id="accept" class="primary" data-t="resolve"></button><button id="unaccept" data-t="unaccept"></button></div></div></section></div><footer><span id="status" data-t="ready"></span><button id="redock" data-t="redock"></button></footer></main>
<input type="file" id="files" accept=".png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff" multiple hidden>
<dialog id="cropDialog"><div class="dialogHead"><h2 data-t="edit"></h2><button id="cropClose">×</button></div><p data-t="cropHint"></p><div id="cropStage"><canvas id="cropCanvas"></canvas></div><div class="row" id="coords"><input type="number" id="x0" aria-label="Left"><input type="number" id="y0" aria-label="Top"><input type="number" id="x1" aria-label="Right"><input type="number" id="y1" aria-label="Bottom"></div><div class="row"><button id="cropReset" data-t="reset"></button><button id="cropSave" class="primary" data-t="apply"></button></div></dialog>
<dialog id="settingsDialog"><div class="dialogHead"><h2 data-t="settings"></h2><button id="settingsClose">×</button></div><div class="setting"><label data-t="language"></label><select id="language"></select></div><div class="setting"><label data-t="theme"></label><select id="theme"><option value="light" data-t="light"></option><option value="dark" data-t="dark"></option><option value="custom" data-t="custom"></option></select></div><div id="colors"></div><div class="setting"><label data-t="font"></label><input id="font" list="fontList"><datalist id="fontList"><option>Segoe UI</option><option>Microsoft YaHei</option><option>Arial</option><option>Noto Sans</option><option>Malgun Gothic</option><option>Yu Gothic</option></datalist></div><div class="setting"><label data-t="fontSize"></label><input id="fontSize" type="number" min="12" max="20"></div><div class="setting"><label data-t="buttonFont"></label><input id="buttonFont" list="fontList"></div><div class="setting"><label data-t="glyphFont"></label><input id="glyphFont" list="fontList"></div><div class="setting"><label data-t="borderWidth"></label><input id="borderWidth" type="number" min="0" max="3"></div><div class="preview" data-t="preview"></div><div class="row"><button id="themeReset" data-t="reset"></button><button id="themeExport" data-t="exportTheme"></button><button id="themeImport" data-t="importTheme"></button><button id="settingsApply" class="primary" data-t="apply"></button></div><input id="themeFile" type="file" accept="application/json" hidden></dialog>
<script src="/bootstrap.js"></script><script src="/i18n.js"></script><script src="/app.js"></script></body></html>
